name: 🚀 Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies and build Next.js frontend
        run: |
          if [ -d "web" ]; then
            cd web
            npm ci
            npm run build
            cd ..
          fi
          if [ -d "api" ]; then
            cd api
            npm ci
            cd ..
          fi

      - name: 🔐 Connect to VPS & Deploy
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "📂 Updating code on VPS..."
            mkdir -p /var/www/seamemories360.com
            cd /var/www/seamemories360.com

            # Avoid "dubious ownership" Git error
            git config --global --add safe.directory /var/www/seamemories360.com

            if [ ! -d ".git" ]; then
              git init
              git remote add origin git@github.com:${{ github.repository }}.git
            else
              git remote set-url origin git@github.com:${{ github.repository }}.git
            fi

            git fetch --depth 1 origin main
            git reset --hard FETCH_HEAD

            apt-get update -y
            apt-get install -y nodejs npm curl
            npm install -g pm2

            echo "📦 Installing & rebuilding apps..."
            cd web
            npm ci
            npm run build
            cd ../api
            npm ci

            echo "🚀 Reloading PM2 with latest code..."
            pm2 reload all || {
              echo "PM2 reload failed, restarting manually..."
              pm2 stop all || true
              pm2 start "npm start" --name seamemories-web --cwd /var/www/seamemories360.com/web --time --watch --max-restarts 10 --restart-delay 5000
              pm2 start "node server.js" --name seamemories-api --cwd /var/www/seamemories360.com/api --time --watch --max-restarts 10 --restart-delay 5000
            }

            pm2 save
            pm2 startup systemd -u root --hp /root
            echo "✅ Deployment finished successfully!"

      - name: 🩺 Health check
        run: |
          echo "⏳ Waiting for server to restart..."
          sleep 10
          curl -f https://seamemories360.com || (echo "❌ Health check failed" && exit 1)
